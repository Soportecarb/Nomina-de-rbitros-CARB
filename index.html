
<script>
function formatDetalle(rowData) {
  const d = rowData._detalle || {}
  return `
    <div class="detalle">
      <h3>${rowData.Nombre || ''}</h3>
      <p><strong>Formación:</strong> ${d.formacion || '—'}</p>
      <p><strong>Cursos:</strong> ${d.cursos || '—'}</p>
      <p><strong>Capacitaciones:</strong> ${d.capacitaciones || '—'}</p>
      <p><strong>Total horas:</strong> ${d.horas || '—'}</p>
    </div>`;
}

$(document).ready(function () {
  $('#arbitros tbody tr').each(function () {
    const $tr = $(this);
    const detalleAttr = $tr.attr('data-detalle');
    const detalleObj = JSON.parse(detalleAttr || '{}');
    const cells = $tr.children('td');
    const rowData = {
      Nombre: cells.eq(2).text().trim(),
      Especialidad: cells.eq(7).text().trim(),
      _detalle: detalleObj
    };
    $tr.data('rowData', rowData);
  });

  const table = $('#arbitros').DataTable({
    responsive: true,
    pageLength: 10,
    dom: 'Bfrtip',
    buttons: [
      { extend: 'excelHtml5', text: 'Excel', exportOptions: { columns: ':visible' } },
      { extend: 'pdfHtml5', text: 'PDF' },
      { extend: 'print', text: 'Imprimir' }
    ],
    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }
  });

  $('#arbitros tbody').on('click', 'td.dt-control', function () {
    const tr = $(this).closest('tr');
    const row = table.row(tr);
    if (row.child.isShown()) {
      row.child.hide();
      tr.removeClass('shown');
      $(this).text('Ver detalle');
    } else {
      const data = tr.data('rowData') || {};
      row.child(formatDetalle(data)).show();
      tr.addClass('shown');
      $(this).text('Ocultar detalle');
    }
  });
});
</script>
</body>
</html>
